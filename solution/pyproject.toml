[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interaction-ledger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0", "python-dotenv>=1.0"]

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools]
packages = ["ledger"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
